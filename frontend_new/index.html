<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="CaseAssist turns a plain-language legal problem into a structured analysis: domain, facts, rights, relevant laws, risk and next steps." />
    <meta name="theme-color" content="#0a1022" />
    <title>CaseAssist | Legal case analysis</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap"
      rel="stylesheet"
    />

    <!-- Apply the saved theme before first paint to avoid a flash. -->
    <script>
      (function () {
        try {
          var saved = localStorage.getItem('caseassist-theme');
          var dark = saved ? saved === 'dark' : true; // dark-first
          document.documentElement.classList.toggle('dark', dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
